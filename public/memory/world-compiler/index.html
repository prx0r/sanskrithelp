<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanskrit World Compiler</title>
<style>body{margin:0;background:#0b0910;color:#eee;font:14px system-ui}header{padding:14px 18px;border-bottom:1px solid #2a2330;display:flex;gap:10px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100vh - 60px)}canvas{width:100%;height:calc(100vh - 60px);touch-action:none}.side{border-left:1px solid #2a2330;padding:14px;overflow:auto}button,label{background:#17111f;color:#eee;border:1px solid #3b3144;border-radius:8px;padding:7px 10px}button{cursor:pointer}.tag{display:inline-block;padding:2px 7px;border:1px solid #554660;border-radius:99px;color:#baaac2}pre{white-space:pre-wrap;color:#c8bccd}small{color:#9c8fa3}.filters{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}@media(max-width:800px){main{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #2a2330}canvas{height:62vh}}</style></head>
<body><header><strong>Sanskrit World Compiler · v0.1</strong><button id="asato">Asato Mā</button><button id="citih">Citiḥ svatantrā</button><label>Load world <input id="file" type="file" accept=".json" hidden></label><label>Load personal overlay <input id="overlay" type="file" accept=".json" hidden></label><small>drag rotate · wheel zoom · click inspect</small></header>
<main><canvas id="c"></canvas><aside class="side"><h2>Shared skeleton / personal surface</h2><p>Coordinates are generated only from the linguistic IR. Colour, rhythm, body-location and imagery live in a separate overlay.</p><div class="filters" id="filters"></div><div id="info"><p>Click a node.</p></div></aside></main>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),info=document.querySelector('#info');let world=null,overlay={bindings:[]},rx=-.45,ry=.45,zoom=31,drag=false,last=[0,0],hidden=new Set();
function binding(id){return (overlay.bindings||[]).find(x=>x.node===id)||{}}
function project(n){let {x,y,z}=n,cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);let x1=x*cy-z*sy,z1=x*sy+z*cy,y1=y*cx-z1*sx,z2=y*sx+z1*cx,d=38,sc=zoom*(d/(d+z2));return{x:canvas.width/2+x1*sc,y:canvas.height/2+y1*sc,z:z2}}
function color(n){let b=binding(n.id);if(b.colour)return b.colour;return ({phoneme:'#697a91',token:'#e5c07b',dhatu:'#c678dd',lemma:'#abb2bf',derivation_step:'#56b6c2',sandhi_gate:'#e06c75',concept:'#98c379',predicate:'#61afef',operator:'#d19a66'})[n.kind]||'#aaa'}
function draw(){if(!world)return;let dpr=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.max(600,r.width*dpr);canvas.height=Math.max(500,r.height*dpr);ctx.fillStyle='#0b0910';ctx.fillRect(0,0,canvas.width,canvas.height);let m=new Map;for(let n of world.nodes)if(!hidden.has(n.kind))m.set(n.id,project(n));ctx.lineWidth=1.2*dpr;for(let e of world.edges){let a=m.get(e.source),b=m.get(e.target);if(!a||!b)continue;ctx.strokeStyle=e.kind.includes('karaka')?'#6d8cab66':'#887b9250';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(let n of world.nodes.filter(n=>m.has(n.id)).sort((a,b)=>m.get(a.id).z-m.get(b.id).z)){let p=m.get(n.id),rr=(n.kind==='phoneme'?4:6)*dpr;ctx.fillStyle=color(n);ctx.globalAlpha=n.kind==='phoneme'?.68:.93;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(n.kind!=='phoneme'||zoom>38){ctx.fillStyle='#eee';ctx.font=`${11*dpr}px system-ui`;ctx.textAlign='center';ctx.fillText(n.label,p.x,p.y-9*dpr)}}}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function pick(e){if(!world)return;let r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height,x=(e.clientX-r.left)*sx,y=(e.clientY-r.top)*sy,best=null,bd=18*(devicePixelRatio||1);for(let n of world.nodes){if(hidden.has(n.kind))continue;let p=project(n),d=Math.hypot(p.x-x,p.y-y);if(d<bd){best=n;bd=d}}if(best){let b=binding(best.id);info.innerHTML=`<h3>${esc(best.label)}</h3><div class=tag>${best.kind}</div><pre>${esc(JSON.stringify(best.data,null,2))}</pre>${Object.keys(b).length?`<h4>Personal overlay</h4><pre>${esc(JSON.stringify(b,null,2))}</pre>`:''}`}}
function filters(){let box=document.querySelector('#filters');box.innerHTML='';for(let k of [...new Set(world.nodes.map(n=>n.kind))].sort()){let b=document.createElement('button');b.textContent=k;b.onclick=()=>{hidden.has(k)?hidden.delete(k):hidden.add(k);b.style.opacity=hidden.has(k)?.45:1;draw()};box.appendChild(b)}}
async function load(url){world=await (await fetch(url)).json();hidden.clear();filters();draw()}
async function loadFile(f,cb){cb(JSON.parse(await f.text()))}
canvas.onpointerdown=e=>{drag=true;last=[e.clientX,e.clientY]};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-last[0])*.008;rx+=(e.clientY-last[1])*.008;last=[e.clientX,e.clientY];draw()};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(10,Math.min(80,zoom-e.deltaY*.03));draw()};canvas.onclick=pick;onresize=draw;
document.querySelector('#asato').onclick=()=>load('../dist/asato-ma.world.json');document.querySelector('#citih').onclick=()=>load('../dist/citih-svatantra.world.json');document.querySelector('#file').onchange=e=>loadFile(e.target.files[0],w=>{world=w;hidden.clear();filters();draw()});document.querySelector('#overlay').onchange=e=>loadFile(e.target.files[0],o=>{overlay=o;draw()});load('../dist/asato-ma.world.json');
</script></body></html>
